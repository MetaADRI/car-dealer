services:
  - type: web
    name: autoelite-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SSL_MODE
        value: require
      - key: PYTHON_VERSION
        value: 3.11.0
